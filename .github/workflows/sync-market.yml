name: Refresh market data with yfinance

on:
  schedule:
    # Taiwan time 06:30, Mon-Fri (22:30 UTC Sun-Thu)
    - cron: "30 22 * * 0-4"
    # Taiwan time 20:30, Mon-Fri (12:30 UTC Mon-Fri)
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-market.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas scikit-learn

      - name: Fetch market data directly with yfinance
        id: refresh
        shell: bash
        run: |
          set +e
          python scripts/sync_market.py > refresh.log 2>&1
          rc=$?
          cat refresh.log
          python - "$rc" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          rc = int(sys.argv[1])
          log = Path("refresh.log").read_text(encoding="utf-8", errors="replace")
          Path("data").mkdir(exist_ok=True)
          Path("data/action_status.json").write_text(
              json.dumps({
                  "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                  "return_code": rc,
                  "success": rc == 0,
                  "log_tail": log.splitlines()[-80:],
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generated JSON
        if: steps.refresh.outputs.rc == '0'
        run: |
          python -m json.tool data/market_report.json > /dev/null
          python -m json.tool data/tw_market_report.json > /dev/null
          python -m json.tool data/status.json > /dev/null
          if compgen -G "data/stocks/*.json" > /dev/null; then
            for f in data/stocks/*.json; do python -m json.tool "$f" > /dev/null; done
          fi

      - name: Commit snapshot and diagnostic status
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh market data via yfinance"
          git push origin HEAD:main

      - name: Fail if yfinance refresh failed
        if: steps.refresh.outputs.rc != '0'
        run: exit 1
